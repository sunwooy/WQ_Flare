name: Hydrocron Download

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  run_hydrocron:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t hydrocron ./Hydrocron_API_dwnld

      - name: Create output directory
        run: mkdir -p output

      - name: Run Hydrocron script
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/output:/app/output" \
            hydrocron

      - name: Verify output
        run: |
          test -s output/PLD_TS.csv

      - name: Commit Hydrocron output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/PLD_TS.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update Hydrocron output"
            git push
          else
            echo "No changes to commit"
          fi
